name: Update Mihomo Core

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Input mihomo core version without v'
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: opennikki-master-writes
  cancel-in-progress: false

jobs:
  update:
    name: Check and Update Mihomo Meta
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MAKEFILE_PATH: mihomo-meta/Makefile
      UPSTREAM_REPO: MetaCubeX/mihomo
      TARGET_BRANCH: master
      GH_TOKEN: ${{ github.token }}
      MIHOMO_VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Refresh mihomo-meta Makefile
        id: meta
        run: |
          set +e
          sh maint/scripts/update-mihomo-core.sh --version "${MIHOMO_VERSION}"
          rc="$?"
          set -e
          if [ "$rc" -ne 0 ]; then
            {
              echo "skip=true"
              echo "need_update=false"
              echo "failure_reason=update command failed"
            } >> "${GITHUB_OUTPUT}"
          fi

      - name: Commit and push changes
        if: steps.meta.outputs.need_update == 'true'
        id: writeback
        run: |
          set -euo pipefail
          . maint/scripts/workflow-writeback.sh
          workflow_writeback_config_git

          git add "${MAKEFILE_PATH}"

          if ! workflow_writeback_has_staged_changes; then
            echo "没有需要提交的变更"
            exit 0
          fi

          git commit -m "chore: update mihomo-meta to ${{ steps.meta.outputs.latest_version }}"
          commit_sha="$(workflow_writeback_head_sha)"
          workflow_writeback_set_output "commit_sha" "${commit_sha}"
          git push origin HEAD:${TARGET_BRANCH}

      - name: Summarize writeback no-op result
        if: steps.meta.outputs.need_update == 'true' && steps.writeback.outputs.commit_sha == ''
        run: |
          set -euo pipefail

          {
            echo "## Mihomo core update result"
            echo
            echo "- Status: no changes"
            echo "- Target branch: \`${TARGET_BRANCH}\`"
            echo "- Current version: \`${{ steps.meta.outputs.current_version }}\`"
            echo "- Target version: \`${{ steps.meta.outputs.latest_version }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Summarize skipped or no-op result
        if: steps.meta.outputs.need_update != 'true'
        run: |
          set -euo pipefail

          status="no changes"
          if [ "${{ steps.meta.outputs.skip }}" = "true" ]; then
            status="skipped"
          fi

          {
            echo "## Mihomo core update result"
            echo
            echo "- Status: ${status}"
            echo "- Target branch: \`${TARGET_BRANCH}\`"
            echo "- Current version: \`${{ steps.meta.outputs.current_version }}\`"
            if [ -n "${{ steps.meta.outputs.latest_version }}" ]; then
              echo "- Target version: \`${{ steps.meta.outputs.latest_version }}\`"
            fi
            if [ -n "${{ steps.meta.outputs.failure_reason }}" ]; then
              echo "- Reason: ${{ steps.meta.outputs.failure_reason }}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Summarize pushed result
        if: steps.meta.outputs.need_update == 'true' && steps.writeback.outputs.commit_sha != ''
        run: |
          set -euo pipefail

          {
            echo "## Mihomo core update result"
            echo
            echo "- Status: pushed"
            echo "- Target branch: \`${TARGET_BRANCH}\`"
            echo "- Current version: \`${{ steps.meta.outputs.current_version }}\`"
            echo "- Target version: \`${{ steps.meta.outputs.latest_version }}\`"
            echo "- Commit: \`${{ steps.writeback.outputs.commit_sha }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Summarize failed result
        if: failure()
        run: |
          {
            echo "## Mihomo core update result"
            echo
            echo "- Status: failed"
            echo "- Target branch: \`${TARGET_BRANCH}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Delete Workflow Runs
        if: always()
        uses: ophub/delete-releases-workflows@main
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          delete_releases: true
          releases_keep_latest: 0
          delete_tags: true
          delete_workflows: true
          workflows_keep_day: 0
